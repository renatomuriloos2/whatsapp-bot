# Rastrea el Portal SGI (Canva) todos los días y actualiza el documento
# "SGI - Enlaces del Portal SGI" en la base de conocimiento del bot.
# Requiere los secretos del repositorio PORTAL_URL y CRON_SECRET
# (Settings → Secrets and variables → Actions).
name: Sincronizar Portal SGI

on:
  schedule:
    - cron: "17 10 * * *" # todos los días, 4:17 a. m. hora de Honduras
  workflow_dispatch: {} # botón "Run workflow" para ejecutarlo a mano

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/crawl-canva.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
